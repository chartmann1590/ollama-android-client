<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin — Ollama AI Chat</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" type="image/png" href="assets/images/icon.png">
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Firebase JS SDK 10.x (compat) -->
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-check-compat.js"></script>

    <style>
        body { background: var(--bg-secondary); color: var(--text-primary); }
        .admin-wrap { max-width: 1100px; margin: 0 auto; padding: 2rem 1.25rem 4rem; }
        .admin-bar { display: flex; align-items: center; justify-content: space-between; gap: 1rem; margin-bottom: 1.5rem; flex-wrap: wrap; }
        .admin-bar h1 { font-size: 1.6rem; font-weight: 800; margin: 0; }
        .admin-bar .who { font-size: 0.85rem; color: var(--text-secondary); }
        .gate { max-width: 460px; margin: 6rem auto; text-align: center; background: var(--bg-card); border: 1px solid var(--border); border-radius: 16px; padding: 2.5rem; }
        .gate h2 { margin: 0 0 0.5rem; }
        .gate p { color: var(--text-secondary); margin-bottom: 1.5rem; }
        .btn { display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem; border: none; border-radius: 10px; padding: 0.7rem 1.2rem; font-weight: 600; font-family: inherit; font-size: 0.9rem; cursor: pointer; background: var(--primary); color: #fff; }
        .btn.secondary { background: none; border: 1px solid var(--border); color: var(--text-secondary); }
        .btn.danger { background: none; border: 1px solid #ef4444; color: #ef4444; padding: 0.3rem 0.6rem; font-size: 0.75rem; }
        .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 1rem; margin-bottom: 2rem; }
        .card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 14px; padding: 1.1rem 1.25rem; }
        .card .n { font-size: 1.8rem; font-weight: 800; color: var(--primary); }
        .card .l { font-size: 0.8rem; color: var(--text-secondary); margin-top: 0.2rem; }
        section.panel { background: var(--bg-card); border: 1px solid var(--border); border-radius: 16px; padding: 1.5rem; margin-bottom: 1.75rem; }
        section.panel h2 { margin: 0 0 1rem; font-size: 1.15rem; display: flex; align-items: center; gap: 0.5rem; }
        .badge { font-size: 0.7rem; font-weight: 700; background: var(--primary); color: #fff; border-radius: 20px; padding: 0.1rem 0.55rem; }
        table { width: 100%; border-collapse: collapse; font-size: 0.82rem; }
        th, td { text-align: left; padding: 0.5rem 0.6rem; border-bottom: 1px solid var(--border); vertical-align: top; }
        th { color: var(--text-secondary); font-weight: 600; white-space: nowrap; }
        td.mono, .mono { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 0.78rem; }
        .pill { font-size: 0.72rem; border-radius: 20px; padding: 0.1rem 0.5rem; font-weight: 600; }
        .pill.yes { background: rgba(34,197,94,0.15); color: #16a34a; }
        .pill.no { background: rgba(148,163,184,0.18); color: var(--text-secondary); }
        .pill.open { background: rgba(34,197,94,0.15); color: #16a34a; }
        .pill.closed { background: rgba(239,68,68,0.15); color: #ef4444; }
        .muted { color: var(--text-secondary); font-size: 0.85rem; }
        .report { border: 1px solid var(--border); border-radius: 10px; padding: 0.85rem 1rem; margin-bottom: 0.75rem; }
        .report .snip { font-size: 0.88rem; margin: 0.25rem 0 0.5rem; white-space: pre-wrap; word-break: break-word; }
        .report .meta { font-size: 0.74rem; color: var(--text-secondary); display: flex; gap: 1rem; flex-wrap: wrap; align-items: center; }
        a.issue-link { color: var(--primary); text-decoration: none; font-weight: 600; }
        a.issue-link:hover { text-decoration: underline; }
        .err { color: #ef4444; font-size: 0.85rem; }
        .scroll { overflow-x: auto; }
    </style>
</head>
<body>
    <!-- Access gate (shown until an authorized admin signs in) -->
    <div id="gate" class="gate" style="display:none">
        <h2>Admin access</h2>
        <p id="gate-msg">Sign in with the administrator account to continue.</p>
        <button id="btn-google" class="btn">Sign in with Google</button>
        <div id="gate-err" class="err" style="margin-top:1rem"></div>
        <button id="btn-gate-signout" class="btn secondary" style="margin-top:1rem; display:none">Sign out</button>
    </div>

    <!-- Dashboard -->
    <div id="app" class="admin-wrap" style="display:none">
        <div class="admin-bar">
            <h1>📊 Admin Dashboard</h1>
            <div>
                <span class="who" id="who"></span>
                <button id="btn-refresh" class="btn secondary">Refresh</button>
                <button id="btn-signout" class="btn secondary">Sign out</button>
            </div>
        </div>

        <div class="cards" id="stats"></div>

        <section class="panel">
            <h2>🚩 Content reports <span class="badge" id="reports-count">0</span></h2>
            <div id="reports"><p class="muted">Loading…</p></div>
        </section>

        <section class="panel">
            <h2>🐙 User-reported GitHub issues <span class="badge" id="issues-count">0</span></h2>
            <div id="issues" class="scroll"><p class="muted">Loading…</p></div>
        </section>

        <section class="panel">
            <h2>👥 Users &amp; sync state <span class="badge" id="users-count">0</span></h2>
            <div id="users" class="scroll"><p class="muted">Loading…</p></div>
        </section>
    </div>

    <script src="admin.js"></script>
</body>
</html>
