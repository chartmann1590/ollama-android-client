name: Android CI

on:
  push:
    paths-ignore:
      - 'feedback-assets/**'
      - 'website/**'
  pull_request:
    branches: [master, main]
  workflow_dispatch:

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

# AdMob configuration is sourced from repository secrets. When a secret is
# unset (e.g. on a fork without the user's account), the build falls back to
# Google's public AdMob test IDs via app/build.gradle.kts so the build still
# succeeds without leaking real ad inventory. The env block lives inside each
# job because the `secrets` context is only valid at job/step scope.

jobs:
  test-and-build:
    name: Test + Build APKs
    runs-on: ubuntu-latest
    env:
      ADS_ENABLED: ${{ vars.ADS_ENABLED || 'true' }}
      ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
      ADMOB_BANNER_AD_UNIT_ID: ${{ secrets.ADMOB_BANNER_AD_UNIT_ID }}
      ADMOB_INTERSTITIAL_AD_UNIT_ID: ${{ secrets.ADMOB_INTERSTITIAL_AD_UNIT_ID }}
      ADMOB_NATIVE_AD_UNIT_ID: ${{ secrets.ADMOB_NATIVE_AD_UNIT_ID }}
      ADMOB_APP_OPEN_AD_UNIT_ID: ${{ secrets.ADMOB_APP_OPEN_AD_UNIT_ID }}
      ADMOB_REWARDED_AD_UNIT_ID: ${{ secrets.ADMOB_REWARDED_AD_UNIT_ID }}
      # Play Billing public license key — used for local purchase signature
      # verification. Public key (ships in the APK), kept in secrets so it isn't
      # hardcoded. Blank in unconfigured forks → verification is skipped.
      PLAY_LICENSE_KEY: ${{ secrets.PLAY_LICENSE_KEY }}
      GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/master' && github.ref != 'refs/heads/main' }}

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Materialize google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "Writing google-services.json from GOOGLE_SERVICES_JSON secret"
            printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
          else
            echo "GOOGLE_SERVICES_JSON secret not set — writing placeholder so the Firebase Gradle plugin can parse the file."
            printf '%s' '{"project_info":{"project_number":"000000000000","project_id":"ollama-android-ci","storage_bucket":"ollama-android-ci.appspot.com"},"client":[{"client_info":{"mobilesdk_app_id":"1:000000000000:android:0000000000000000000000","android_client_info":{"package_name":"com.charles.ollama.client.play"}},"oauth_client":[],"api_key":[{"current_key":"AIzaSyA-placeholder-placeholder-placeholder000"}],"services":{"appinvite_service":{"other_platform_oauth_client":[]}}},{"client_info":{"mobilesdk_app_id":"1:000000000000:android:1111111111111111111111","android_client_info":{"package_name":"com.charles.ollama.client.github"}},"oauth_client":[],"api_key":[{"current_key":"AIzaSyA-placeholder-placeholder-placeholder000"}],"services":{"appinvite_service":{"other_platform_oauth_client":[]}}}],"configuration_version":"1"}' > app/google-services.json
          fi

      - name: Materialize release keystore
        env:
          RELEASE_KEYSTORE: ${{ secrets.RELEASE_KEYSTORE }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [ -z "$RELEASE_KEYSTORE" ]; then
            echo "RELEASE_KEYSTORE secret not set — release build will fall back to debug signing."
            exit 0
          fi
          echo "$RELEASE_KEYSTORE" | base64 -d > app/release.keystore
          {
            echo "storeFile=app/release.keystore"
            echo "storePassword=$RELEASE_KEYSTORE_PASSWORD"
            echo "keyAlias=$RELEASE_KEY_ALIAS"
            echo "keyPassword=$RELEASE_KEY_PASSWORD"
          } > keystore.properties

      - name: Run unit tests
        run: ./gradlew :app:testPlayDebugUnitTest :app:testGithubDebugUnitTest --stacktrace

      - name: Run lint
        run: ./gradlew :app:lintPlayDebug --stacktrace

      - name: Assemble debug APK
        run: ./gradlew :app:assemblePlayDebug --stacktrace

      - name: Assemble release APKs (Play + GitHub)
        run: ./gradlew :app:assemblePlayRelease :app:assembleGithubRelease --stacktrace

      - name: Bundle release AABs (Play + GitHub)
        run: ./gradlew :app:bundlePlayRelease :app:bundleGithubRelease --stacktrace

      - name: Verify flavor separation and version metadata
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          # Source-set guardrail: updater implementation must live only in github flavor.
          forbidden_main = [
              Path("app/src/main/java/com/charles/ollama/client/ui/update/UpdateAvailablePrompt.kt"),
              Path("app/src/main/java/com/charles/ollama/client/ui/update/UpdateViewModel.kt"),
              Path("app/src/main/java/com/charles/ollama/client/data/update/UpdateChecker.kt"),
              Path("app/src/main/java/com/charles/ollama/client/data/update/UpdateInfo.kt"),
              Path("app/src/main/java/com/charles/ollama/client/data/update/UpdatePreferences.kt"),
          ]
          missing_github = [
              Path("app/src/github/java/com/charles/ollama/client/ui/update/UpdateAvailablePrompt.kt"),
              Path("app/src/github/java/com/charles/ollama/client/ui/update/UpdateViewModel.kt"),
              Path("app/src/github/java/com/charles/ollama/client/data/update/UpdateChecker.kt"),
              Path("app/src/github/java/com/charles/ollama/client/data/update/UpdateInfo.kt"),
              Path("app/src/github/java/com/charles/ollama/client/data/update/UpdatePreferences.kt"),
          ]
          missing_play_stub = Path("app/src/play/java/com/charles/ollama/client/ui/update/UpdateAvailablePrompt.kt")

          violations = [str(p) for p in forbidden_main if p.exists()]
          github_missing = [str(p) for p in missing_github if not p.exists()]
          play_stub_missing = not missing_play_stub.exists()

          if violations:
              raise SystemExit("Updater code leaked into main source set: " + ", ".join(violations))
          if github_missing:
              raise SystemExit("GitHub updater source files missing: " + ", ".join(github_missing))
          if play_stub_missing:
              raise SystemExit("Play no-op updater stub missing: " + str(missing_play_stub))

          run_number = int(os.environ["GITHUB_RUN_NUMBER"])
          expected_version_code = 1000 + run_number
          expected_play_version_name = f"1.2.{run_number}"
          expected_github_version_name = f"1.2.{run_number}-github"

          play_meta = json.loads(Path("app/build/outputs/apk/play/release/output-metadata.json").read_text(encoding="utf-8"))
          github_meta = json.loads(Path("app/build/outputs/apk/github/release/output-metadata.json").read_text(encoding="utf-8"))

          play = play_meta["elements"][0]
          github = github_meta["elements"][0]

          assert play_meta["applicationId"] == "com.charles.ollama.client.play", play_meta["applicationId"]
          assert github_meta["applicationId"] == "com.charles.ollama.client.github", github_meta["applicationId"]
          assert play["versionCode"] == expected_version_code, (play["versionCode"], expected_version_code)
          assert github["versionCode"] == expected_version_code, (github["versionCode"], expected_version_code)
          assert play["versionName"] == expected_play_version_name, (play["versionName"], expected_play_version_name)
          assert github["versionName"] == expected_github_version_name, (github["versionName"], expected_github_version_name)
          PY

      - name: Upload unit test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/test*DebugUnitTest
          if-no-files-found: ignore

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/play/debug/app-play-debug.apk
          if-no-files-found: error

      - name: Upload Play release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-play-release-apk
          path: app/build/outputs/apk/play/release/*.apk
          if-no-files-found: error

      - name: Upload GitHub release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-github-release-apk
          path: app/build/outputs/apk/github/release/*.apk
          if-no-files-found: error

      - name: Upload Play release AAB
        uses: actions/upload-artifact@v4
        with:
          name: app-play-release-aab
          path: app/build/outputs/bundle/playRelease/*.aab
          if-no-files-found: error

      - name: Upload GitHub release AAB
        uses: actions/upload-artifact@v4
        with:
          name: app-github-release-aab
          path: app/build/outputs/bundle/githubRelease/*.aab
          if-no-files-found: error

  e2e:
    name: E2E launch test (emulator)
    needs: test-and-build
    runs-on: ubuntu-22.04
    env:
      ADS_ENABLED: ${{ vars.ADS_ENABLED || 'true' }}
      ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
      ADMOB_BANNER_AD_UNIT_ID: ${{ secrets.ADMOB_BANNER_AD_UNIT_ID }}
      ADMOB_INTERSTITIAL_AD_UNIT_ID: ${{ secrets.ADMOB_INTERSTITIAL_AD_UNIT_ID }}
      ADMOB_NATIVE_AD_UNIT_ID: ${{ secrets.ADMOB_NATIVE_AD_UNIT_ID }}
      ADMOB_APP_OPEN_AD_UNIT_ID: ${{ secrets.ADMOB_APP_OPEN_AD_UNIT_ID }}
      ADMOB_REWARDED_AD_UNIT_ID: ${{ secrets.ADMOB_REWARDED_AD_UNIT_ID }}
      # Play Billing public license key — used for local purchase signature
      # verification. Public key (ships in the APK), kept in secrets so it isn't
      # hardcoded. Blank in unconfigured forks → verification is skipped.
      PLAY_LICENSE_KEY: ${{ secrets.PLAY_LICENSE_KEY }}
      GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}

    # Guards two prior Crashlytics regressions that both surfaced at app open:
    #   * UnsatisfiedLinkError: litertlm_jni from LiteRtChatService.<init>
    #   * IllegalArgumentException "parameter must be a descendant of this view"
    #     from ViewGroup.offsetRectBetweenParentAndChild
    # Also guards the AdMob `${admobAppId}` manifest placeholder substitution —
    # if the env vars don't reach the build, AdMob crashes the process at first
    # ad load, which the placeholder assertion in MainActivityLaunchTest catches.
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Materialize google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
          else
            printf '%s' '{"project_info":{"project_number":"000000000000","project_id":"ollama-android-ci","storage_bucket":"ollama-android-ci.appspot.com"},"client":[{"client_info":{"mobilesdk_app_id":"1:000000000000:android:0000000000000000000000","android_client_info":{"package_name":"com.charles.ollama.client.play"}},"oauth_client":[],"api_key":[{"current_key":"AIzaSyA-placeholder-placeholder-placeholder000"}],"services":{"appinvite_service":{"other_platform_oauth_client":[]}}},{"client_info":{"mobilesdk_app_id":"1:000000000000:android:1111111111111111111111","android_client_info":{"package_name":"com.charles.ollama.client.github"}},"oauth_client":[],"api_key":[{"current_key":"AIzaSyA-placeholder-placeholder-placeholder000"}],"services":{"appinvite_service":{"other_platform_oauth_client":[]}}}],"configuration_version":"1"}' > app/google-services.json
          fi

      - name: Build Play release universal APK from AAB
        run: ./gradlew :app:packagePlayReleaseUniversalApk --stacktrace

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: AVD cache
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-33-default-x86_64

      - name: Create AVD snapshot
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2.32.0
        with:
          api-level: 33
          target: default
          arch: x86_64
          profile: pixel_4
          force-avd-creation: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot
          disable-animations: true
          script: echo "AVD snapshot generated"

      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@v2.32.0
        with:
          api-level: 33
          target: default
          arch: x86_64
          profile: pixel_4
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot -no-snapshot
          disable-animations: true
          script: |
            set -eu
            ./gradlew :app:connectedPlayDebugAndroidTest --stacktrace
            adb uninstall com.charles.ollama.client.play >/dev/null 2>&1 || true
            adb install -r app/build/outputs/apk_from_bundle/playRelease/app-play-release-universal.apk
            adb logcat -c
            adb shell monkey -p com.charles.ollama.client.play -c android.intent.category.LAUNCHER 1
            sleep 8
            adb shell pidof com.charles.ollama.client.play >/dev/null
            adb logcat -d -t 1000 > /tmp/release-logcat.txt
            grep -E "FATAL EXCEPTION| E AndroidRuntime|ANR in com.charles.ollama.client.play" /tmp/release-logcat.txt > /tmp/release-crash.log || true
            cat /tmp/release-crash.log
            test ! -s /tmp/release-crash.log

      - name: Upload instrumented test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-test-report
          path: app/build/reports/androidTests/connected
          if-no-files-found: ignore

      - name: Upload Play release universal APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-play-release-universal-apk
          path: app/build/outputs/apk_from_bundle/playRelease/app-play-release-universal.apk
          if-no-files-found: ignore

  release:
    name: Publish rolling release
    needs:
      - test-and-build
      - e2e
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Play release APK
        uses: actions/download-artifact@v4
        with:
          name: app-play-release-apk
          path: artifacts/play-apk

      - name: Download GitHub release APK
        uses: actions/download-artifact@v4
        with:
          name: app-github-release-apk
          path: artifacts/github-apk

      - name: Download Play release AAB
        uses: actions/download-artifact@v4
        with:
          name: app-play-release-aab
          path: artifacts/play-aab

      - name: Download GitHub release AAB
        uses: actions/download-artifact@v4
        with:
          name: app-github-release-aab
          path: artifacts/github-aab

      - name: Compute release metadata
        id: meta
        env:
          RELEASE_KEYSTORE: ${{ secrets.RELEASE_KEYSTORE }}
        run: |
          SHORT_SHA="$(git rev-parse --short "$GITHUB_SHA")"
          TAG="ci-${GITHUB_RUN_NUMBER}-${SHORT_SHA}"
          # Mirror the formula in app/build.gradle.kts: versionCode = 1000 +
          # GITHUB_RUN_NUMBER, versionName = "1.2.<run_number>". Surfaced in
          # the release notes so the Play Console version is obvious from the
          # GitHub Release page without unzipping the APK.
          VERSION_CODE=$((1000 + GITHUB_RUN_NUMBER))
          VERSION_NAME="1.2.${GITHUB_RUN_NUMBER}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "name=v${VERSION_NAME} (build ${VERSION_CODE})" >> "$GITHUB_OUTPUT"
          if [ -n "$RELEASE_KEYSTORE" ]; then
            SIGNING_NOTE="signed with the release keystore"
          else
            SIGNING_NOTE="signed with the debug key (no RELEASE_KEYSTORE secret configured)"
          fi
          {
            echo "body<<EOF"
            echo "Automated release build from \`${GITHUB_REF_NAME}\` at commit \`${SHORT_SHA}\`."
            echo ""
            echo "## Play Store metadata"
            echo "- versionCode: \`${VERSION_CODE}\`"
            echo "- versionName: \`${VERSION_NAME}\`"
            echo ""
            echo "## What's in this build"
            echo "- Play flavor APK produced by \`:app:assemblePlayRelease\`, ${SIGNING_NOTE}"
            echo "- GitHub flavor APK produced by \`:app:assembleGithubRelease\`, ${SIGNING_NOTE}"
            echo "- Play flavor App Bundle (AAB) produced by \`:app:bundlePlayRelease\`, ${SIGNING_NOTE} — upload this to the Play Console"
            echo "- GitHub flavor App Bundle (AAB) produced by \`:app:bundleGithubRelease\`, ${SIGNING_NOTE}"
            echo "- AdMob IDs injected from repository secrets (test IDs in unconfigured forks)"
            echo "- Unit tests, lint, and the on-device launch smoke test passed"
            echo ""
            echo "Install with \`adb install ollama-android-play-${TAG}.apk\` or \`adb install ollama-android-github-${TAG}.apk\`."
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Stage release assets
        run: |
          mkdir -p release
          play_apk_src=$(ls artifacts/play-apk/*.apk | head -n1)
          cp "$play_apk_src" "release/ollama-android-play-${{ steps.meta.outputs.tag }}.apk"
          github_apk_src=$(ls artifacts/github-apk/*.apk | head -n1)
          cp "$github_apk_src" "release/ollama-android-github-${{ steps.meta.outputs.tag }}.apk"
          play_aab_src=$(ls artifacts/play-aab/*.aab | head -n1)
          cp "$play_aab_src" "release/ollama-android-play-${{ steps.meta.outputs.tag }}.aab"
          github_aab_src=$(ls artifacts/github-aab/*.aab | head -n1)
          cp "$github_aab_src" "release/ollama-android-github-${{ steps.meta.outputs.tag }}.aab"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_BODY: ${{ steps.meta.outputs.body }}
          RELEASE_TAG: ${{ steps.meta.outputs.tag }}
          RELEASE_NAME: ${{ steps.meta.outputs.name }}
        run: |
          # Publish with the gh CLI in a single atomic call. This creates the tag
          # and a published (non-draft) release together — avoiding the
          # softprops/action-gh-release two-phase flow, which was leaving releases
          # stuck as drafts with "untagged-" URLs that never reach the public
          # Releases page.
          printf '%s' "$RELEASE_BODY" > release_notes.md
          # Make the step idempotent on re-runs: drop any partial release/tag first.
          gh release delete "$RELEASE_TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$RELEASE_TAG" \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_NAME" \
            --notes-file release_notes.md \
            --latest \
            release/*.apk release/*.aab
