name: Amazon Appstore build + emulator test

# Amazon Appstore (Fire) flavor. Builds the amazon debug + release APKs, then installs and runs
# them on an emulator WITHOUT Google Play services (like a Fire device). Branch builds only make a
# DRAFT release; nothing is uploaded to any store.
on:
  push:
    branches: [amazon]
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: amazon-${{ github.ref }}
  cancel-in-progress: true

jobs:
  amazon:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '21'
    - name: Free disk space
      run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/local/lib/node_modules || true
    - name: google-services.json (real if set, else a dummy)
      run: "if [ -n \"${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}\" ]; then\n  echo \"${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}\" | base64 -d > app/google-services.json\nelif [ ! -f app/google-services.json ]; then\n  cat > app/google-services.json <<'EOF'\n{\"project_info\":{\"project_number\":\"0\",\"project_id\":\"ci-dummy\",\"storage_bucket\":\"ci-dummy.appspot.com\"},\"client\":[{\"client_info\":{\"mobilesdk_app_id\":\"1:0:android:0000000000000000\",\"android_client_info\":{\"package_name\":\"com.charles.ollama.client.play\"}},\"oauth_client\":[],\"api_key\":[{\"current_key\":\"ci-dummy-key\"}],\"services\":{\"appinvite_service\":{\"other_platform_oauth_client\":[]}}}],\"configuration_version\":\"1\"}\nEOF\nfi\n"
    - name: Release keystore (if set)
      run: "if [ -n \"${{ secrets.ANDROID_KEYSTORE_BASE64 }}\" ]; then\n  echo \"${{ secrets.ANDROID_KEYSTORE_BASE64 }}\" | base64 -d > \"${{ runner.temp }}/release.jks\"\n  echo \"ANDROID_KEYSTORE_PATH=${{ runner.temp }}/release.jks\" >> \"$GITHUB_ENV\"\nfi\n"
    - name: Ollama google-services.json + keystore (same as android-ci.yml)
      env:
        GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        RELEASE_KEYSTORE: ${{ secrets.RELEASE_KEYSTORE }}
        RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
        RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
      run: "if [ -n \"$GOOGLE_SERVICES_JSON\" ]; then printf '%s' \"$GOOGLE_SERVICES_JSON\" > app/google-services.json; fi\nif [ -n \"$RELEASE_KEYSTORE\" ]; then\n  echo \"$RELEASE_KEYSTORE\" | base64 -d > app/release.keystore\n  printf 'storeFile=app/release.keystore\\nstorePassword=%s\\nkeyAlias=%s\\nkeyPassword=%s\\n' \"$RELEASE_KEYSTORE_PASSWORD\" \"$RELEASE_KEY_ALIAS\" \"$RELEASE_KEY_PASSWORD\" > keystore.properties\nfi\n"
    - name: Build amazon APKs
      env:
        ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        APP_VERSION_CODE: ${{ github.run_number }}
        ADS_ENABLED: ${{ vars.ADS_ENABLED || 'true' }}
        ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
        ADMOB_BANNER_AD_UNIT_ID: ${{ secrets.ADMOB_BANNER_AD_UNIT_ID }}
        ADMOB_INTERSTITIAL_AD_UNIT_ID: ${{ secrets.ADMOB_INTERSTITIAL_AD_UNIT_ID }}
        ADMOB_NATIVE_AD_UNIT_ID: ${{ secrets.ADMOB_NATIVE_AD_UNIT_ID }}
        ADMOB_APP_OPEN_AD_UNIT_ID: ${{ secrets.ADMOB_APP_OPEN_AD_UNIT_ID }}
        ADMOB_REWARDED_AD_UNIT_ID: ${{ secrets.ADMOB_REWARDED_AD_UNIT_ID }}
        GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
      run: 'set -o pipefail

        chmod +x gradlew

        ./gradlew :app:assembleAmazonDebug :app:assembleAmazonRelease --console=plain --stacktrace 2>&1 | tee -a /tmp/amz-build.log

        rm -f "${{ runner.temp }}/release.jks" keystore.properties app/release.keystore

        mkdir -p amz-apk

        cp $(ls app/build/outputs/apk/amazon/debug/*.apk | head -1) amz-apk/OllamaChat-amazon-debug.apk

        cp $(ls app/build/outputs/apk/amazon/release/*.apk | head -1) amz-apk/OllamaChat-amazon-release.apk

        ls -la amz-apk

        echo "--- release signer"; $ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools | sort -V | tail -1)/apksigner verify --print-certs amz-apk/OllamaChat-amazon-release.apk | head -5 || true

        echo "--- manifest (release)"; $ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools | sort -V | tail -1)/aapt2 dump badging amz-apk/OllamaChat-amazon-release.apk | head -5 || true

        echo "--- Google Play references in the amazon release dex/resources"

        unzip -p amz-apk/OllamaChat-amazon-release.apk ''classes*.dex'' ''resources.arsc'' | strings | grep -ciE "play\.google\.com|market://|com\.android\.billingclient" || true

        '
    - name: App Tester (Amazon IAP sandbox) from Tab's private test drop
      env:
        DROP_KEY: ${{ secrets.DROP_KEY }}
      run: "U=https://hs-apk-drop.charles-h-hartmann1.workers.dev\nif [ -n \"$DROP_KEY\" ] && curl -sf -m 30 -H \"X-Key: $DROP_KEY\" \"$U/c/apptester.info/0\" -o /tmp/at.info; then\n  n=$(sed -E 's/.*\"chunks\":([0-9]+).*/\\1/' /tmp/at.info); rm -f /tmp/apptester.apk\n  for ((i=0;i<n;i++)); do curl -sf -m 120 -H \"X-Key: $DROP_KEY\" \"$U/c/apptester/$i\" >> /tmp/apptester.apk; done\n  ls -la /tmp/apptester.apk\nelse echo \"no App Tester in the drop\"; fi\n"
    - name: Ship build log tail to the private drop (on failure)
      if: failure()
      env:
        DROP_KEY: ${{ secrets.DROP_KEY }}
      run: 'tail -c 60000 /tmp/amz-build.log 2>/dev/null | curl -s -m 60 -X PUT -H "X-Key: $DROP_KEY" --data-binary @- "https://hs-apk-drop.charles-h-hartmann1.workers.dev/c/amzlog_${{ github.event.repository.name }}_r${{ github.run_number }}/0" || true

        '
    - name: Enable KVM
      run: 'echo ''KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"'' | sudo tee /etc/udev/rules.d/99-kvm4all.rules

        sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm

        '
    - name: Emulator test (no Google Play services, like Fire)
      uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: 30
        profile: Nexus 7 2013
        target: default
        arch: x86_64
        ram-size: 3072M
        disk-size: 4096M
        emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
        disable-animations: true
        script: bash .github/amazon/run-tests.sh
    - name: Upload test results to Tab's private drop
      if: always()
      env:
        DROP_KEY: ${{ secrets.DROP_KEY }}
      run: |
        # the tested release APK rides along so it can be staged for the Appstore upload (Tab, Nov 9 2026)
        mkdir -p /tmp/amz-out && cp amz-apk/*release*.apk /tmp/amz-out/ 2>/dev/null || true
        bash .github/amazon/amazon-upload.sh /tmp/amz-out amz_OllamaChat_r${{ github.run_number }}
    - name: Draft release with the amazon APKs (not published)
      if: success()
      uses: softprops/action-gh-release@v2
      with:
        tag_name: amazon-${{ github.run_number }}
        name: Amazon build ${{ github.run_number }} (${{ github.sha }})
        draft: true
        files: 'amz-apk/OllamaChat-amazon-release.apk

          '
