name: Publish Google Play

on:
  workflow_dispatch:
    inputs:
      confirm_play_publish:
        description: 'Type "publish" to upload a completed production release to Google Play.'
        required: true
        type: string
      release_notes:
        description: 'Optional Play release notes. Leave blank to generate from commits.'
        required: false
        type: string

concurrency:
  group: publish-google-play
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

jobs:
  publish:
    name: Build and publish Play release
    runs-on: ubuntu-latest
    env:
      ADS_ENABLED: ${{ vars.ADS_ENABLED || 'true' }}
      ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
      ADMOB_BANNER_AD_UNIT_ID: ${{ secrets.ADMOB_BANNER_AD_UNIT_ID }}
      ADMOB_INTERSTITIAL_AD_UNIT_ID: ${{ secrets.ADMOB_INTERSTITIAL_AD_UNIT_ID }}
      ADMOB_NATIVE_AD_UNIT_ID: ${{ secrets.ADMOB_NATIVE_AD_UNIT_ID }}
      ADMOB_APP_OPEN_AD_UNIT_ID: ${{ secrets.ADMOB_APP_OPEN_AD_UNIT_ID }}
      ADMOB_REWARDED_AD_UNIT_ID: ${{ secrets.ADMOB_REWARDED_AD_UNIT_ID }}
      PLAY_LICENSE_KEY: ${{ secrets.PLAY_LICENSE_KEY }}
      GH_API_TOKEN: ${{ secrets.GH_API_TOKEN || 'stub_token' }}
      GH_REPO_OWNER: ${{ secrets.GH_REPO_OWNER || 'chartmann1590' }}
      GH_REPO_NAME: ${{ secrets.GH_REPO_NAME || 'ollama-android-client' }}
      GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

    steps:
      - name: Require explicit Play publish confirmation
        env:
          CONFIRM_PLAY_PUBLISH: ${{ inputs.confirm_play_publish }}
        run: |
          if [ "$CONFIRM_PLAY_PUBLISH" != "publish" ]; then
            echo 'Refusing to publish: confirm_play_publish must be exactly "publish".'
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Materialize google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "GOOGLE_SERVICES_JSON is required for a Play release."
            exit 1
          fi
          printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json

      - name: Materialize release keystore
        env:
          RELEASE_KEYSTORE: ${{ secrets.RELEASE_KEYSTORE }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          missing=0
          for name in RELEASE_KEYSTORE RELEASE_KEYSTORE_PASSWORD RELEASE_KEY_ALIAS RELEASE_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "$name is required for a Play release."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

          echo "$RELEASE_KEYSTORE" | base64 -d > app/release.keystore
          {
            echo "storeFile=app/release.keystore"
            echo "storePassword=$RELEASE_KEYSTORE_PASSWORD"
            echo "keyAlias=$RELEASE_KEY_ALIAS"
            echo "keyPassword=$RELEASE_KEY_PASSWORD"
          } > keystore.properties

      - name: Compute Play version
        run: |
          version_code="$(date -u +'%y%j%H%M')"
          version_name="1.2.$(date -u +'%Y%m%d.%H%M')"
          {
            echo "ANDROID_VERSION_CODE=$version_code"
            echo "ANDROID_VERSION_NAME=$version_name"
          } >> "$GITHUB_ENV"
          echo "Using versionCode=$version_code"
          echo "Using versionName=$version_name"

      - name: Run Play unit tests
        run: ./gradlew :app:testPlayDebugUnitTest --stacktrace

      - name: Run Play lint
        run: ./gradlew :app:lintPlayDebug --stacktrace

      - name: Build Play release bundle
        run: ./gradlew :app:bundlePlayRelease --stacktrace

      - name: Prepare Play release notes
        env:
          RELEASE_NOTES_INPUT: ${{ inputs.release_notes }}
        run: |
          mkdir -p distribution/whatsnew
          notes_file="distribution/whatsnew/whatsnew-en-US"

          if [ -n "$RELEASE_NOTES_INPUT" ]; then
            printf '%s\n' "$RELEASE_NOTES_INPUT" > "$notes_file"
          else
            previous_tag="$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)"
            if [ -n "$previous_tag" ]; then
              git log "${previous_tag}..HEAD" --pretty=format:'- %s' --no-merges > "$notes_file"
            else
              git log -20 --pretty=format:'- %s' --no-merges > "$notes_file"
            fi

            if [ ! -s "$notes_file" ] && [ -f listing/whats_new.txt ]; then
              cp listing/whats_new.txt "$notes_file"
            fi
          fi

          python - <<'PY'
          from pathlib import Path

          path = Path("distribution/whatsnew/whatsnew-en-US")
          text = path.read_text(encoding="utf-8").strip()
          if not text:
              text = "Bug fixes and performance improvements."

          lines = []
          for raw in text.splitlines():
              line = raw.strip()
              if not line:
                  continue
              for prefix in ("### ", "## ", "# "):
                  if line.startswith(prefix):
                      line = line[len(prefix):].strip()
              if len(line) > 500:
                  line = line[:497].rstrip() + "..."
              lines.append(line)

          text = "\n".join(lines).strip()
          if len(text) > 5000:
              text = text[:4997].rstrip() + "..."
          path.write_text(text + "\n", encoding="utf-8")
          PY

          echo "Play release notes:"
          cat "$notes_file"

      - name: Upload Play release artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-play-release-aab
          path: app/build/outputs/bundle/playRelease/*.aab
          if-no-files-found: error

      - name: Verify Google Play service account
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$GOOGLE_PLAY_SERVICE_ACCOUNT_JSON" ]; then
            echo "GOOGLE_PLAY_SERVICE_ACCOUNT_JSON is required to publish to Google Play."
            exit 1
          fi

      - name: Update Google Play listing metadata
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          PLAY_PACKAGE_NAME: com.charles.ollama.client.play
          PLAY_LISTING_LANGUAGE: en-US
        run: |
          python -m pip install --quiet google-auth requests
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          import google.auth.transport.requests
          import requests
          from google.oauth2 import service_account

          package_name = os.environ["PLAY_PACKAGE_NAME"]
          language = os.environ["PLAY_LISTING_LANGUAGE"]
          service_account_json = os.environ["GOOGLE_PLAY_SERVICE_ACCOUNT_JSON"]
          credentials = service_account.Credentials.from_service_account_info(
              json.loads(service_account_json),
              scopes=["https://www.googleapis.com/auth/androidpublisher"],
          )
          credentials.refresh(google.auth.transport.requests.Request())
          headers = {
              "Authorization": f"Bearer {credentials.token}",
              "Accept": "application/json",
              "Content-Type": "application/json",
          }

          full_description = Path("listing/full_description.txt").read_text(encoding="utf-8").strip()
          short_description = Path("listing/short_description.txt").read_text(encoding="utf-8").strip()
          if not full_description:
              raise SystemExit("listing/full_description.txt is empty")
          if not short_description:
              raise SystemExit("listing/short_description.txt is empty")
          if len(full_description) > 4000:
              raise SystemExit("listing/full_description.txt exceeds Google Play's 4000-character limit")
          if len(short_description) > 80:
              raise SystemExit("listing/short_description.txt exceeds Google Play's 80-character limit")

          base = f"https://androidpublisher.googleapis.com/androidpublisher/v3/applications/{package_name}"
          edit = requests.post(f"{base}/edits", headers=headers, timeout=30)
          edit.raise_for_status()
          edit_id = edit.json()["id"]

          listing = requests.patch(
              f"{base}/edits/{edit_id}/listings/{language}",
              headers=headers,
              json={
                  "fullDescription": full_description,
                  "shortDescription": short_description,
              },
              timeout=30,
          )
          listing.raise_for_status()

          commit = requests.post(f"{base}/edits/{edit_id}:commit", headers=headers, timeout=30)
          commit.raise_for_status()
          print(f"Updated Google Play listing metadata for {package_name} ({language}).")
          PY

      - name: Publish to Google Play production
        uses: r0adkll/upload-google-play@v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.charles.ollama.client.play
          releaseFiles: app/build/outputs/bundle/playRelease/*.aab
          tracks: production
          status: completed
          whatsNewDirectory: distribution/whatsnew
          mappingFile: app/build/outputs/mapping/playRelease/mapping.txt
