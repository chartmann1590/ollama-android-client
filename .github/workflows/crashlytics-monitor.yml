name: Crashlytics Monitor

on:
  schedule:
    - cron: '0 * * * *'   # top of every hour
  workflow_dispatch:

permissions:
  issues: write
  contents: read

env:
  FIREBASE_PROJECT_NUMBER: '975905920250'
  FIREBASE_APP_ID: '1:975905920250:android:29aeadb6282771bc5c2543'
  FIREBASE_PROJECT_ID: 'ollama-android-7525f'

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Exchange Firebase refresh token for access token
        id: auth
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          FIREBASE_OAUTH_CLIENT_ID: ${{ secrets.FIREBASE_OAUTH_CLIENT_ID }}
          FIREBASE_OAUTH_CLIENT_SECRET: ${{ secrets.FIREBASE_OAUTH_CLIENT_SECRET }}
        run: |
          RESPONSE=$(curl -s -X POST "https://oauth2.googleapis.com/token" \
            --data-urlencode "client_id=${FIREBASE_OAUTH_CLIENT_ID}" \
            --data-urlencode "client_secret=${FIREBASE_OAUTH_CLIENT_SECRET}" \
            --data-urlencode "refresh_token=${FIREBASE_TOKEN}" \
            --data-urlencode "grant_type=refresh_token")
          ACCESS_TOKEN=$(echo "$RESPONSE" | jq -r '.access_token')
          if [ "$ACCESS_TOKEN" = "null" ] || [ -z "$ACCESS_TOKEN" ]; then
            echo "Failed to obtain access token"
            echo "$RESPONSE" | jq .
            exit 1
          fi
          echo "::add-mask::${ACCESS_TOKEN}"
          echo "access_token=$ACCESS_TOKEN" >> "$GITHUB_OUTPUT"

      - name: Fetch Crashlytics top issues
        id: fetch
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: |
          curl -s \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            "https://firebasecrashlytics.googleapis.com/v1alpha/projects/${FIREBASE_PROJECT_NUMBER}/apps/${FIREBASE_APP_ID}/reports/topIssues?pageSize=25" \
            > crashlytics_issues.json
          cat crashlytics_issues.json | jq .
          if cat crashlytics_issues.json | jq -e '.error' > /dev/null 2>&1; then
            echo "Crashlytics API returned an error (see above)"
            exit 1
          fi

      - name: Sync to GitHub Issues
        uses: actions/github-script@v7
        env:
          FIREBASE_PROJECT_ID: ${{ env.FIREBASE_PROJECT_ID }}
          FIREBASE_APP_ID: ${{ env.FIREBASE_APP_ID }}
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const data = JSON.parse(fs.readFileSync('crashlytics_issues.json', 'utf8'));

            const { owner, repo } = context.repo;
            const projectId   = process.env.FIREBASE_PROJECT_ID;
            const today       = new Date().toISOString().slice(0, 10); // YYYY-MM-DD
            const SILENCE_DAYS = 5;
            const LAST_EVENT_RE = /<!-- crashlytics-last-event:(\d{4}-\d{2}-\d{2}) -->/;

            function daysSince(dateStr) {
              const then = new Date(dateStr + 'T00:00:00Z');
              return Math.floor((Date.now() - then.getTime()) / 86_400_000);
            }

            // Close a Crashlytics issue via the REST API (best-effort; errors are logged, not fatal).
            async function closeInCrashlytics(crashlyticsId) {
              const projectNumber = process.env.FIREBASE_PROJECT_NUMBER;
              const appId         = process.env.FIREBASE_APP_ID;
              const token         = process.env.ACCESS_TOKEN;
              const url = `https://firebasecrashlytics.googleapis.com/v1alpha/projects/${projectNumber}/apps/${appId}/issues/${crashlyticsId}?updateMask=state`;
              const resp = await fetch(url, {
                method:  'PATCH',
                headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
                body:    JSON.stringify({ state: 'CLOSED' }),
              });
              if (!resp.ok) {
                const txt = await resp.text();
                throw new Error(`HTTP ${resp.status}: ${txt.slice(0, 200)}`);
              }
              return resp.json();
            }

            // v1alpha returns { groups: [ { issue: {...}, metrics: [{eventsCount, impactedUsersCount, ...}] } ] }
            const rawGroups = data.groups || data.issues || [];
            const crashlyticsIssues = rawGroups.map(entry => {
              const inner = entry.issue || entry;
              const m = entry.metrics?.[0] || {};
              return {
                id:               inner.id || inner.issueId,
                title:            inner.title       || 'Unknown crash',
                subtitle:         inner.subtitle    || '',
                state:           (inner.state       || 'OPEN').toUpperCase(),
                errorType:        inner.errorType   || 'FATAL',
                firstSeenVersion: inner.firstSeenVersion || '—',
                lastSeenVersion:  inner.lastSeenVersion  || '—',
                signals:          inner.signals     || [],
                consoleUri:       inner.uri         || '',
                eventCount:       parseInt(String(m.eventsCount || inner.eventCount || entry.eventCount || '0'), 10),
                impactedUsers:    parseInt(String(m.impactedUsersCount || '0'), 10),
                sessionsCount:    parseInt(String(m.sessionsCount || '0'), 10),
                metricsStart:     m.startTime || '',
                metricsEnd:       m.endTime   || '',
              };
            }).filter(i => i.id);

            console.log(`Crashlytics returned ${crashlyticsIssues.length} issues`);

            // Emoji helpers
            const errorEmoji = { FATAL: '💥', ANR: '⏳', NON_FATAL: '⚠️' };
            const signalEmoji = { SIGNAL_REGRESSED: '🔴 Regressed', SIGNAL_FRESH: '🆕 New', SIGNAL_EARLY: '⚡ Early-session', SIGNAL_REPETITIVE: '🔁 Repetitive' };

            function buildIssueBody(ci) {
              const emoji = errorEmoji[ci.errorType] || '🐛';
              const typeLabel = ci.errorType === 'ANR' ? 'ANR (App Not Responding)' : ci.errorType === 'NON_FATAL' ? 'Non-Fatal Exception' : 'Fatal Crash';
              const range = ci.metricsStart ? `${ci.metricsStart.slice(0,10)} – ${ci.metricsEnd.slice(0,10)}` : 'Last 7 days';
              const signalLines = ci.signals.map(s => `- ${signalEmoji[s.signal] || s.signal}: ${s.description}`).join('\n');
              const url = ci.consoleUri || `https://console.firebase.google.com/project/${projectId}/crashlytics/app/android:com.charles.ollama.client.play/issues/${ci.id}`;

              return [
                `## ${emoji} ${typeLabel}`,
                ``,
                `| Field | Value |`,
                `|-------|-------|`,
                `| **Crashlytics ID** | \`${ci.id}\` |`,
                `| **Exception** | ${ci.subtitle || '—'} |`,
                `| **Blame frame** | \`${ci.title}\` |`,
                `| **Error type** | ${typeLabel} |`,
                `| **First seen** | ${ci.firstSeenVersion} |`,
                `| **Last seen** | ${ci.lastSeenVersion} |`,
                `| **Events (${range})** | ${ci.eventCount.toLocaleString()} |`,
                `| **Impacted users** | ${ci.impactedUsers.toLocaleString()} |`,
                `| **Sessions affected** | ${ci.sessionsCount.toLocaleString()} |`,
                ``,
                signalLines ? `### Signals\n${signalLines}\n` : '',
                `[🔥 View in Firebase Console](${url})`,
                ``,
                `<!-- crashlytics-events:${ci.eventCount} -->`,
                `<!-- crashlytics-last-event:${today} -->`,
              ].filter(l => l !== '').join('\n');
            }

            // Ensure the base label exists
            try {
              await github.rest.issues.getLabel({ owner, repo, name: 'crashlytics' });
            } catch {
              await github.rest.issues.createLabel({
                owner, repo,
                name: 'crashlytics',
                color: 'ee0701',
                description: 'Firebase Crashlytics crash report'
              });
            }

            // Load all open GitHub issues tagged crashlytics (up to 100)
            const { data: openGHIssues } = await github.rest.issues.listForRepo({
              owner, repo,
              labels: 'crashlytics',
              state: 'open',
              per_page: 100,
            });

            // Build map: crashlyticsId -> GitHub issue
            const ghMap = {};
            for (const gh of openGHIssues) {
              for (const lbl of gh.labels) {
                if (lbl.name && lbl.name.startsWith('crashlytics:')) {
                  ghMap[lbl.name.slice('crashlytics:'.length)] = gh;
                }
              }
            }

            const openIds = new Set();

            for (const ci of crashlyticsIssues) {
              if (ci.state !== 'OPEN') continue;
              openIds.add(ci.id);

              // Label name capped at 50 chars (GitHub limit)
              const labelName = `crashlytics:${ci.id}`.substring(0, 50);

              // Ensure per-issue label
              try {
                await github.rest.issues.getLabel({ owner, repo, name: labelName });
              } catch {
                await github.rest.issues.createLabel({
                  owner, repo,
                  name: labelName,
                  color: 'b60205',
                  description: `Crashlytics issue ${ci.id}`
                });
              }

              const existing = ghMap[ci.id];

              if (!existing) {
                const created = await github.rest.issues.create({
                  owner, repo,
                  title: `[Crashlytics] ${ci.subtitle || ci.title}`,
                  body: buildIssueBody(ci),
                  labels: ['crashlytics', labelName],
                });
                console.log(`Created GitHub issue #${created.data.number} for Crashlytics ${ci.id}`);

              } else {
                // Update if event count grew
                const prevMatch = (existing.body || '').match(/<!-- crashlytics-events:(\d+) -->/);
                const prev = prevMatch ? parseInt(prevMatch[1], 10) : 0;

                if (ci.eventCount > prev) {
                  await github.rest.issues.createComment({
                    owner, repo,
                    issue_number: existing.number,
                    body: [
                      `📈 **Event count updated:** ${prev.toLocaleString()} → ${ci.eventCount.toLocaleString()} (+${(ci.eventCount - prev).toLocaleString()})`,
                      `- **Impacted users:** ${ci.impactedUsers.toLocaleString()}`,
                      `- **Sessions:** ${ci.sessionsCount.toLocaleString()}`,
                      `- **Last seen version:** ${ci.lastSeenVersion}`,
                      ``,
                      `*Checked: ${new Date().toISOString()}*`,
                    ].join('\n'),
                  });
                  // Refresh both the event count and the last-event date stamp.
                  let newBody = (existing.body || '').replace(
                    /<!-- crashlytics-events:\d+ -->/,
                    `<!-- crashlytics-events:${ci.eventCount} -->`
                  );
                  if (LAST_EVENT_RE.test(newBody)) {
                    newBody = newBody.replace(LAST_EVENT_RE, `<!-- crashlytics-last-event:${today} -->`);
                  } else {
                    newBody += `\n<!-- crashlytics-last-event:${today} -->`;
                  }
                  await github.rest.issues.update({
                    owner, repo,
                    issue_number: existing.number,
                    body: newBody,
                  });
                  console.log(`Updated #${existing.number}: ${prev} → ${ci.eventCount} events (last-event: ${today})`);
                } else {
                  console.log(`Issue #${existing.number} unchanged at ${ci.eventCount} events`);
                }
              }
            }

            // ── Auto-close stale / resolved issues ───────────────────────────
            // Two closing conditions:
            //   A) Issue is no longer in the Crashlytics open list → already resolved upstream.
            //   B) Issue is still open in Crashlytics but has had no new events for SILENCE_DAYS
            //      days → proactively close here and in Crashlytics.
            for (const [cid, gh] of Object.entries(ghMap)) {
              const resolvedUpstream = !openIds.has(cid);
              let silentDays = null;

              if (!resolvedUpstream) {
                // Check last-event stamp for 5-day silence rule.
                const m = (gh.body || '').match(LAST_EVENT_RE);
                if (m) {
                  silentDays = daysSince(m[1]);
                }
              }

              const shouldClose = resolvedUpstream || (silentDays !== null && silentDays >= SILENCE_DAYS);
              if (!shouldClose) {
                if (silentDays !== null) {
                  console.log(`Issue #${gh.number} (${cid}): ${silentDays} day(s) silent — watching (closes at ${SILENCE_DAYS})`);
                }
                continue;
              }

              // Build a human-readable close reason.
              let reason, detail;
              if (resolvedUpstream) {
                reason = 'Crashlytics issue is no longer in the open list — it has been resolved upstream.';
                detail = '';
              } else {
                reason = `No new crash events have been recorded for **${silentDays} consecutive days** (threshold: ${SILENCE_DAYS} days).`;
                detail = '\n\nThis issue is also being closed in the Firebase Crashlytics console.';
              }

              await github.rest.issues.createComment({
                owner, repo,
                issue_number: gh.number,
                body: [
                  `## ✅ Auto-closed — crash no longer active`,
                  ``,
                  reason + detail,
                  ``,
                  `| Field | Value |`,
                  `|-------|-------|`,
                  `| **Crashlytics ID** | \`${cid}\` |`,
                  `| **Days since last event** | ${silentDays !== null ? silentDays : '—'} |`,
                  `| **Closed by** | Crashlytics monitor (automated) |`,
                  `| **Checked** | ${new Date().toISOString()} |`,
                  ``,
                  `If this crash reappears in a future version, Crashlytics will reopen it automatically.`,
                ].join('\n'),
              });

              await github.rest.issues.update({
                owner, repo,
                issue_number: gh.number,
                state: 'closed',
              });
              console.log(`Auto-closed #${gh.number} (${cid}) — ${resolvedUpstream ? 'resolved upstream' : `${silentDays}d silent`})`);

              // For condition B, also close the Crashlytics issue so it doesn't keep
              // appearing in the Firebase console.
              if (!resolvedUpstream) {
                try {
                  await closeInCrashlytics(cid);
                  console.log(`  → Closed ${cid} in Crashlytics`);
                } catch (e) {
                  console.log(`  → Warning: could not close ${cid} in Crashlytics: ${e.message}`);
                }
              }
            }
